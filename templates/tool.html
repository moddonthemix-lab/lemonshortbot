<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} • Lemon Squeeze</title>
  <style>
    :root {
      --lemon: #f6c833;
      --citrus: #fbeec7;
      --leaf: #0b7d54;
      --text: #243017;
      --muted: #4e5a35;
      --card: #fff9e6;
      --border: #f0dca4;
    }
    * { box-sizing: border-box; }
    html, body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--citrus);
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .bg-lemons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-lemons img {
      position: absolute;
      opacity: 0.14;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,0.15));
      animation: floaty 12s ease-in-out infinite alternate;
    }
    .bg-lemons img.lemon-1 { width: 360px; left: 4%; top: 12%; animation-duration: 13s; }
    .bg-lemons img.lemon-2 { width: 280px; right: 6%; top: 30%; animation-duration: 11s; }
    .bg-lemons img.lemon-3 { width: 320px; left: 12%; bottom: -4%; animation-duration: 14s; }
    @keyframes floaty {
      0% { transform: translateY(0px) rotate(-2deg) scale(1); }
      100% { transform: translateY(-18px) rotate(2deg) scale(1.04); }
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #fffef8;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--leaf);
      letter-spacing: 0.2px;
      text-decoration: none;
    }
    .nav-pills {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fffef8;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .pill:hover { border-color: var(--leaf); color: var(--leaf); box-shadow: 0 6px 18px rgba(11,125,84,0.12); }
    .cta-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 800;
      border: 2px solid var(--leaf);
      color: #fffef8;
      background: var(--leaf);
      box-shadow: 0 10px 26px rgba(11,125,84,0.22);
      transition: all 0.2s ease;
    }
    .btn.secondary {
      background: #fffef8;
      color: var(--leaf);
      border-color: var(--leaf);
      box-shadow: none;
    }
    .btn:hover { transform: translateY(-2px); }
    .hero-bar {
      padding: 18px;
      text-align: center;
      background: linear-gradient(135deg, #fffef8, #fff4c9);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 10px 26px rgba(0,0,0,0.06);
      position: relative;
      z-index: 1;
    }
    .hero-bar h1 { margin: 0 0 6px; color: var(--leaf); }
    .hero-bar p { margin: 0; color: var(--muted); }
    .frame-wrap {
      flex: 1;
      padding: 18px;
      position: relative;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 180px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
      background: #000;
    }
  </style>
</head>
<body>
  <div class="bg-lemons">
    <img src="/static/lemon_bubble.png" class="lemon-1" alt="">
    <img src="/static/lemon_bubble.png" class="lemon-2" alt="">
    <img src="/static/lemon_bubble.png" class="lemon-3" alt="">
  </div>
  <header>
    <a class="brand" href="/">🍋 Lemon Squeeze</a>
    <div class="nav-pills">
      <a class="pill" href="/squeeze">Short Squeeze</a>
      <a class="pill" href="/daily">Daily</a>
      <a class="pill" href="/hourly">Hourly</a>
      <a class="pill" href="/weekly">Weekly</a>
      <a class="pill" href="/crypto">Crypto</a>
      <a class="pill" href="/lemonai">LemonAI</a>
      <a class="pill" href="/challenges">Challenges</a>
      <a class="pill" href="/lemonade">Lemonade</a>
    </div>
    <div class="cta-row">
      <a class="btn secondary" href="/app">Open Terminal</a>
      <a class="btn" href="/app">Start Squeezing</a>
    </div>
  </header>

  <div class="hero-bar">
    <h1>{{ title }}</h1>
    <p>{{ subtitle if subtitle else 'Powered by the original Lemon Squeeze engine — refreshed UI, same backend logic.' }}</p>
  </div>

  <div class="frame-wrap">
    <iframe src="{{ iframe_src }}" title="{{ title }}" id="tool-frame"></iframe>
  </div>

  <script>
    (function() {
      const tabKey = "{{ tab_key }}";
      const frame = document.getElementById('tool-frame');
      frame.addEventListener('load', () => {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument || win.document;
          // Hide legacy chrome
          const style = doc.createElement('style');
          style.textContent = `
            header, .tabs, .toolbar, .market-timer, .auth-container, .floating-actions {
              display: none !important;
            }
            body { background: transparent !important; }
            .content { padding: 18px !important; }
          `;
          doc.head.appendChild(style);
          // Activate desired tab if switchTab exists
          if (typeof win.switchTab === 'function') {
            win.switchTab(tabKey);
          }
        } catch (err) {
          console.warn('Could not style embedded tool:', err);
        }
      });
    })();
  </script>
</body>
</html>
